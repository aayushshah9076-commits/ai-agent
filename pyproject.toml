[project]
name = "anime-ai-agent"
version = "1.0.0"
description = "AI-powered anime video creation agent - analyzes text, designs characters, generates scenes, and produces full anime episodes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
